name: Atualização Diária do Dashboard

on:
  schedule:
    # Executa todos os dias às 06:00 horário de Brasília (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar manualmente com 1 clique pelo site do GitHub
  push:
    branches:
      - main
    paths:
      - 'Controle de Estudos2.xlsm'
      - 'etl.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas de dados
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de ETL (Processar Excel)
        run: |
          python etl.py

      - name: Salvar dados atualizados no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add study_data.json study_data.js
          git diff --staged --quiet || (git commit -m "Auto: Dados atualizados na nuvem [skip ci]" && git push)
