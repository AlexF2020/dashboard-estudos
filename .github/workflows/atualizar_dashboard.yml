name: Atualização Diária do Dashboard

on:
  schedule:
    # Executa todos os dias às 06:00 horário de Brasília (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar manualmente com 1 clique pelo site do GitHub
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas de dados
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de ETL (Processar Excel)
        run: |
          python etl.py

      - name: Gravar dados processados no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add study_data.json study_data.js
          git diff --staged --quiet || (git commit -m "Atualização automática de dados [skip ci]" && git push)

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar Dashboard no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
